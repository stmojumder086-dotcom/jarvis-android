plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.bangla'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.bangla"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2"
    }

    // প্রতি বিল্ডে একই সাইনিং কী ব্যবহার হয়, তাই নতুন সংস্করণ আগেরটার উপরেই বসে (আনইনস্টল লাগে না)
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
