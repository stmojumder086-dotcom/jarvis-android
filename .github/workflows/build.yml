name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          DIR="$(dirname "$(find . -name settings.gradle | head -n 1)")"
          cd "$DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: '**/app-debug.apk'

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find . -name app-debug.apk | head -n 1)"
          cp "$APK" jarvis.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest jarvis.apk --title "Jarvis (latest build)" --notes "Auto-built APK" --target "${{ github.sha }}"
